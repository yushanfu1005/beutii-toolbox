<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beutii 門市工具箱</title>
<style>
:root{
  --paper:#f6f4ef;
  --sidebar:#fdfcfa;
  --card:#ffffff;
  --ink:#20241f;
  --ink-soft:#6b6f66;
  --line:#e4e0d6;
  --gold:#bd8a44;
  --gold-d:#a5762f;
  --gold-soft:#f2e4cc;
  --navy:#16233a;
  --navy-soft:#e7ecf1;
  --bullet:#c9c4b6;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  background:var(--paper);color:var(--ink);
  display:flex;height:100vh;overflow:hidden;
}

/* ---------- Sidebar ---------- */
.sidebar{
  width:236px;flex:0 0 236px;
  background:var(--sidebar);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  padding:18px 14px;
  position:relative;
  transition:width .18s ease,flex-basis .18s ease,padding .18s ease;
}
.sidebar.collapsed{width:64px;flex:0 0 64px;padding:18px 8px;}
.collapse-btn{
  position:absolute;top:20px;right:-13px;width:26px;height:26px;border-radius:50%;
  background:#fff;border:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.12);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-size:12px;color:var(--ink-soft);z-index:10;padding:0;transition:transform .18s ease;
}
.collapse-btn:hover{color:var(--gold-d);border-color:var(--gold);}
.sidebar.collapsed .collapse-btn{transform:rotate(180deg);}
.sidebar.collapsed .brand-text,
.sidebar.collapsed .nav-label,
.sidebar.collapsed .nav-tag,
.sidebar.collapsed .sidebar-footer{display:none;}
.sidebar.collapsed .sidebar-brand{justify-content:center;padding:4px 0 18px;}
.sidebar.collapsed .nav-item{justify-content:center;padding:10px 4px;}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:4px 6px 18px;border-bottom:1px solid var(--line);margin-bottom:14px;}
.brand-badge{
  width:34px;height:34px;border-radius:9px;flex:0 0 34px;
  background:linear-gradient(135deg,var(--gold),var(--gold-d));
  color:#fff;font-weight:800;font-size:15px;
  display:flex;align-items:center;justify-content:center;
}
.brand-text .title{font-size:15px;font-weight:800;color:var(--ink);letter-spacing:.02em;}
.brand-text .sub{font-size:10.5px;color:var(--gold-d);font-weight:600;letter-spacing:.03em;margin-top:1px;}

.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;
  color:var(--ink-soft);font-size:13.5px;font-weight:600;cursor:pointer;margin-bottom:2px;
  border:none;background:none;width:100%;text-align:left;font-family:inherit;
}
.nav-item:hover{background:var(--navy-soft);color:var(--ink);}
.nav-item.active{background:var(--gold-soft);color:var(--ink);font-weight:700;}
.nav-item.disabled{opacity:0.5;cursor:not-allowed;}
.nav-item.disabled:hover{background:none;color:var(--ink-soft);}
.nav-bullet{
  width:7px;height:7px;border-radius:2px;flex:0 0 7px;background:var(--bullet);
}
.nav-item.active .nav-bullet{background:var(--gold);}
.nav-tag{
  margin-left:auto;font-size:9.5px;background:var(--line);color:var(--ink-soft);
  padding:2px 7px;border-radius:999px;font-weight:700;
}
.sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);}
.sidebar-footer .role-label{font-size:10.5px;color:var(--ink-soft);margin-bottom:6px;}
.sidebar-footer .role-badge{
  display:inline-block;font-size:11px;font-weight:700;color:var(--gold-d);
  background:var(--gold-soft);padding:3px 10px;border-radius:999px;
}
.sidebar-footer .note{font-size:10.5px;color:var(--ink-soft);margin-top:10px;line-height:1.6;}

/* ---------- Main area ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.main-header{
  padding:14px 22px;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;
}
.main-header h1{margin:0;font-size:15.5px;color:var(--ink);font-weight:800;}
.main-header .desc{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.status-pill{
  font-size:11px;font-weight:700;color:#fff;background:var(--navy);
  padding:5px 12px;border-radius:999px;
}
.frame-wrap{flex:1;min-height:0;}
iframe{width:100%;height:100%;border:none;display:block;background:var(--paper);}

.placeholder{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;color:var(--ink-soft);text-align:center;padding:40px;
}
.placeholder .icon{font-size:40px;}
.placeholder .msg{font-size:14px;max-width:360px;line-height:1.6;}

@media(max-width:820px){
  body{flex-direction:column;height:auto;overflow:visible;}
  .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:10px;align-items:center;}
  .sidebar-brand{display:none;}
  .nav-item{flex:0 0 auto;margin-bottom:0;white-space:nowrap;}
  .sidebar-footer{display:none;}
  .collapse-btn{display:none;}
  .frame-wrap{height:80vh;}
}
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <button class="collapse-btn" id="btnCollapse" title="收合／展開側邊欄">‹</button>
  <div class="sidebar-brand">
    <div class="brand-badge">B</div>
    <div class="brand-text">
      <div class="title">Beutii 門市工具箱</div>
      <div class="sub">以質感款待生活</div>
    </div>
  </div>
  <button class="nav-item active" data-module="m1">
    <span class="nav-bullet"></span><span class="nav-label">客詢與檔期管理</span>
  </button>
  <button class="nav-item" data-module="m2">
    <span class="nav-bullet"></span><span class="nav-label">百貨檔期抵用券計算器</span>
  </button>
  <button class="nav-item" data-module="m3">
    <span class="nav-bullet"></span><span class="nav-label">寄倉費試算</span>
  </button>
  <div class="sidebar-footer">
    <div class="role-label">系統管理者</div>
    <span class="role-badge">管理者</span>
    <div class="note">各模組資料獨立儲存於瀏覽器本機，互不影響。</div>
  </div>
</div>

<div class="main">
  <div class="main-header">
    <div>
      <h1 id="moduleTitle">客詢與檔期管理</h1>
      <div class="desc" id="moduleDesc">客人詢問商品追蹤 × 訂金明細 × 多檔期管理</div>
    </div>
    <span class="status-pill" id="statusPill">使用中</span>
  </div>
  <div class="frame-wrap" id="frameWrap">
    <iframe id="moduleFrame" title="工具模組"></iframe>
  </div>
</div>

<script>
(function(){
"use strict";

var MODULES = {
  m1: {
    title: '客詢與檔期管理',
    desc: '客人詢問商品追蹤 × 訂金明細 × 多檔期管理',
    url: 'inquiry.html'
  },
  m2: {
    title: '百貨檔期抵用券計算器',
    desc: '多門市檔期抵用券／點數方案試算',
    url: 'voucher.html'
  },
  m3: {
    title: '寄倉費試算',
    desc: '免費寄倉資格確認與逾期費用試算',
    url: 'storage.html'
  }
};

var frame = document.getElementById('moduleFrame');
var frameWrap = document.getElementById('frameWrap');
var titleEl = document.getElementById('moduleTitle');
var descEl = document.getElementById('moduleDesc');

function showPlaceholder(msg){
  frameWrap.innerHTML =
    '<div class="placeholder">'+
      '<div class="icon">🚧</div>'+
      '<div class="msg">'+msg+'</div>'+
    '</div>';
}

function loadModule(key){
  var mod = MODULES[key];
  Array.prototype.forEach.call(document.querySelectorAll('.nav-item'), function(el){
    el.classList.toggle('active', el.getAttribute('data-module')===key);
  });
  if(!mod){
    titleEl.textContent = '尚未加入';
    descEl.textContent = '';
    showPlaceholder('這個模組還沒有加入這個工具箱。');
    return;
  }
  titleEl.textContent = mod.title;
  descEl.textContent = mod.desc;
  if(frameWrap.querySelector('.placeholder')){
    frameWrap.innerHTML = '<iframe id="moduleFrame" title="工具模組"></iframe>';
    frame = document.getElementById('moduleFrame');
  }
  if(frame.getAttribute('data-current')!==key){
    frame.src = mod.url;
  }
  frame.setAttribute('data-current', key);
}

Array.prototype.forEach.call(document.querySelectorAll('.nav-item'), function(btn){
  btn.addEventListener('click', function(){
    if(btn.classList.contains('disabled')) return;
    loadModule(btn.getAttribute('data-module'));
  });
});

var sidebarEl = document.getElementById('sidebar');
var collapseBtn = document.getElementById('btnCollapse');
try{
  if(localStorage.getItem('beutii_toolbox_sidebar_collapsed')==='1'){ sidebarEl.classList.add('collapsed'); }
}catch(e){}
collapseBtn.addEventListener('click', function(){
  sidebarEl.classList.toggle('collapsed');
  try{
    localStorage.setItem('beutii_toolbox_sidebar_collapsed', sidebarEl.classList.contains('collapsed') ? '1' : '0');
  }catch(e){}
});

loadModule('m1');

})();
</script>
</body>
</html>
